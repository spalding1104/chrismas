@if (store.error(); as error) {
    <div class="notice notice--error" role="alert">
        <span
            >{{ error }}. Kiểm tra backend (thư mục <code>server</code>) đã chạy
            chưa.</span
        >
        <button
            type="button"
            class="btn btn--ghost btn--sm"
            (click)="store.load()"
        >
            Thử lại
        </button>
    </div>
}

@if (store.isSample()) {
    <div class="notice" role="status">
        <span
            >Đây là dữ liệu mẫu để bạn xem thử. Xóa đi để bắt đầu ghi chép của
            riêng bạn.</span
        >
        <button
            type="button"
            class="btn btn--ghost btn--sm"
            (click)="store.clearSample()"
        >
            Xóa dữ liệu mẫu
        </button>
    </div>
}

<app-summary-overview
    [income]="store.totalIncome()"
    [expense]="store.totalExpense()"
    [incomeCount]="incomeCount()"
    [expenseCount]="expenseCount()"
/>

<div class="layout">
    <div class="layout__side">
        <app-card [heading]="editing() ? 'Sửa giao dịch' : 'Thêm giao dịch'">
            <app-transaction-form
                [editing]="editing()"
                [defaultDate]="defaultDate()"
                (saved)="onSave($event)"
                (cancelled)="editing.set(null)"
            />
        </app-card>

        <app-card
            heading="Khoản cố định hằng tháng"
            subheading="Tự tính vào mỗi tháng"
        >
            <app-recurring-card
                [items]="recurring.items()"
                [month]="store.selectedMonth()"
                [error]="recurring.error()"
                (create)="recurring.add($event, store.selectedMonth())"
                (update)="
                    recurring.update(
                        $event.id,
                        $event.draft,
                        store.selectedMonth()
                    )
                "
                (remove)="recurring.remove($event, store.selectedMonth())"
            />
        </app-card>
    </div>

    <div class="layout__main">
        <app-card
            heading="Biểu đồ danh mục"
            [subheading]="breakdownSubheading()"
        >
            <app-segmented-control
                cardActions
                ariaLabel="Xem theo"
                [options]="breakdownOptions"
                [(value)]="breakdownType"
            />
            <app-category-chart
                [items]="breakdownItems()"
                [transactions]="store.monthTransactions()"
            />
        </app-card>

        <app-card
            heading="Giao dịch trong tháng"
            [subheading]="store.monthTransactions().length + ' giao dịch'"
        >
            <app-segmented-control
                cardActions
                ariaLabel="Lọc giao dịch"
                [options]="listFilterOptions"
                [(value)]="listFilter"
            />
            <app-transaction-list
                [transactions]="visibleTransactions()"
                [activeId]="editing()?.id ?? null"
                (edit)="editing.set($event)"
                (remove)="onRemove($event)"
            />
        </app-card>
    </div>
</div>
