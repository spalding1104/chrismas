@for (option of options(); track option.value) {
  <button
    type="button"
    role="radio"
    class="segment"
    [attr.data-value]="option.value"
    [class.segment--active]="option.value === value()"
    [attr.aria-checked]="option.value === value()"
    [disabled]="disabled()"
    (click)="select(option.value)"
  >
    {{ option.label }}
  </button>
}
