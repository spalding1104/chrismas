<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiệp Giáng Sinh</title>
<meta name="description" content="Tạo và gửi thiệp Giáng Sinh online cho người thân yêu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<header class="top">
  <div class="countdown" id="countdown" aria-live="polite"></div>
  <div class="actions">
    <button class="icon-btn" id="musicBtn" aria-pressed="false" title="Bật/tắt nhạc">🔈 Nhạc</button>
    <button class="icon-btn" id="editBtn" title="Tạo thiệp của bạn">✏️ Tạo thiệp</button>
  </div>
</header>

<main class="stage">
  <!-- Envelope -->
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Mở thiệp">
    <div class="env-back"></div>
    <div class="letter" id="letter"><span>Merry Christmas</span></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">🎄</div>
  </div>
  <article class="card" id="card" hidden>
    <svg class="tree" viewBox="0 0 200 240" aria-hidden="true">
      <polygon class="star" points="100,6 108,28 131,28 112,42 119,64 100,50 81,64 88,42 69,28 92,28"/>
      <polygon fill="#1f7a3f" points="100,40 150,110 50,110"/>
      <polygon fill="#1a6b37" points="100,75 165,160 35,160"/>
      <polygon fill="#155c2f" points="100,110 180,210 20,210"/>
      <rect x="88" y="210" width="24" height="24" rx="3" fill="#7a4a2a"/>
      <g class="bulbs">
        <circle cx="85" cy="95" r="5" fill="#ff4d4d"/>
        <circle cx="118" cy="100" r="5" fill="#ffd34d"/>
        <circle cx="70" cy="140" r="5" fill="#4dd2ff"/>
        <circle cx="102" cy="135" r="5" fill="#ff7ae0"/>
        <circle cx="132" cy="148" r="5" fill="#ff4d4d"/>
        <circle cx="55" cy="195" r="5" fill="#ffd34d"/>
        <circle cx="90" cy="185" r="5" fill="#4dd2ff"/>
        <circle cx="125" cy="190" r="5" fill="#ff7ae0"/>
        <circle cx="150" cy="198" r="5" fill="#ffd34d"/>
      </g>
    </svg>
    <p class="to" id="toText">Gửi bạn,</p>
    <h1 class="title">Merry Christmas</h1>
    <p class="msg" id="msgText"></p>
    <p class="from" id="fromText"></p>
  </article>
  <button class="btn replay" id="replayBtn" hidden>↺ Mở lại</button>
  <p class="hint" id="hint">Chạm vào phong bì để mở thiệp ✨</p>
</main>

<!-- Editor -->
<dialog id="editor">
  <form method="dialog" class="editor" id="editorForm">
    <h2>Tạo thiệp của bạn</h2>
    <label>Gửi đến
      <input id="inTo" maxlength="40" placeholder="VD: Mẹ yêu">
    </label>
    <label>Lời chúc
      <textarea id="inMsg" rows="4" maxlength="300" placeholder="Viết lời chúc của bạn..."></textarea>
    </label>
    <label>Từ
      <input id="inFrom" maxlength="40" placeholder="VD: Con gái của mẹ">
    </label>
    <div class="row">
      <button type="button" class="btn ghost" id="previewBtn">Xem thử</button>
      <button type="button" class="btn" id="copyBtn">Sao chép link 🎁</button>
    </div>
    <p class="copied" id="copied" role="status"></p>
    <button class="close" value="close" aria-label="Đóng">✕</button>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
